app:
  telegram:
    url: ${wiremock.server.baseUrl}/bot
    token: test-token
    update-listener-sleep: 1s
    debug: true
  kafka:
    topic:
      link-updates: link.processed-updates

spring:
  kafka:
    consumer:
      group-id: bot-group-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080

spring:
  application:
    name: bot
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: bot-group
      auto-offset-reset: earliest

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  scrapper:
    base-url: ${SCRAPPER_BASE_URL:http://localhost:8081}
  kafka:
    topic:
      link-updates: link-updates
    consumer:
      retry-attempts: 3
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}

server:
  port: 8082

spring:
  application:
    name: ai-agent
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ai-agent-group
      auto-offset-reset: earliest
    producer:
      acks: all
    schema-registry:
      url: ${SCHEMA_REGISTRY_URL:mock://test}

app:
  kafka:
    topic:
      raw-updates: link.raw-updates
      processed-updates: link.processed-updates

ai-agent:
  filtering:
    stop-words:
      - spam
      - ads
      - promo
    excluded-authors:
      - bot-user
    min-length: 20
  summarization:
    threshold: 500
    mode: ai
  ai-api:
    url: ${HUGGINGFACE_API_URL:https://api-inference.huggingface.co/models/facebook/bart-large-cnn}
    token: ${HUGGINGFACE_TOKEN:}
  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs
  grouping:
    window-ms: 30000

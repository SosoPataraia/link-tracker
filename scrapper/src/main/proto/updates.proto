syntax = "proto3";

option java_multiple_files = true;
option java_package = "backend.academy.linktracker.grpc";
option java_outer_classname = "UpdatesProto";

package updates;

service UpdatesService {
    rpc SendUpdate (LinkUpdateRequest) returns (LinkUpdateResponse);
}

message LinkUpdateRequest {
    int64 id = 1;
    string url = 2;
    string description = 3;
    repeated int64 tg_chat_ids = 4;
}

message LinkUpdateResponse {
    bool success = 1;
}

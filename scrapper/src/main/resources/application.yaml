server:
  port: 8081

spring:
  application:
    name: scrapper
  datasource:
    url: jdbc:postgresql://localhost:5432/scrapper
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.type.mapping: linkUpdate:backend.academy.linktracker.scrapper.dto.LinkUpdate
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}
  data:
    redis:
      host: localhost
      port: 6379

app:
  stackoverflow:
    key: ${STACKOVERFLOW_KEY:}
    access-token: ${STACKOVERFLOW_ACCESS_KEY:}
  github:
    token: ${GITHUB_TOKEN:}
  bot:
    base-url: ${BOT_BASE_URL:http://localhost:8080}
  scheduler:
    interval: 60000
    batch-size: 100
    thread-count: 4
  database:
    access-type: SQL
  notification:
    transport: kafka
    kafka:
      topic:
        link-updates: link-updates
        link-updates-dlt: link-updates.DLT
  outbox:
    poll-interval-ms: 1000
  cache:
    ttl: 60s
    client-side-enabled: false
  http-client:
    connect-timeout: 3s
    read-timeout: 5s
  resilience:
    retryable-status-codes: 500,502,503,504
    retry-wait-duration: 500ms
    retry-max-attempts: 3
    retry-exponential-backoff-enabled: false
    retry-exponential-backoff-multiplier: 2
  rate-limit:
    capacity: 50
    refill-tokens: 50
    refill-period: 1m

resilience4j:
  circuitbreaker:
    instances:
      githubClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      stackOverflowClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
      botClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
  retry:
    instances:
      githubClient:
        max-attempts: ${app.resilience.retry-max-attempts}
        wait-duration: ${app.resilience.retry-wait-duration}
        enable-exponential-backoff: ${app.resilience.retry-exponential-backoff-enabled:false}
        exponential-backoff-multiplier: ${app.resilience.retry-exponential-backoff-multiplier:2}
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      stackOverflowClient:
        max-attempts: ${app.resilience.retry-max-attempts}
        wait-duration: ${app.resilience.retry-wait-duration}
        enable-exponential-backoff: ${app.resilience.retry-exponential-backoff-enabled:false}
        exponential-backoff-multiplier: ${app.resilience.retry-exponential-backoff-multiplier:2}
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

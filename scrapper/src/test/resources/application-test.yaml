spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  jpa:
    hibernate:
      ddl-auto: validate

app:
  database:
    access-type: SQL
  notification:
    transport: kafka
  kafka:
    topic:
      link-updates: link-updates
      link-updates-dlt: link-updates.DLT
